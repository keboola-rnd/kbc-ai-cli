name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: kbc-app-linux-x64
            os: ubuntu-latest
          - target: bun-linux-arm64
            artifact: kbc-app-linux-arm64
            os: ubuntu-latest
          - target: bun-darwin-x64
            artifact: kbc-app-darwin-x64
            os: macos-13
          - target: bun-darwin-arm64
            artifact: kbc-app-darwin-arm64
            os: macos-14
          - target: bun-windows-x64
            artifact: kbc-app-windows-x64.exe
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: bun install

      - name: Build binary
        run: bun build src/cli.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/kbc-app-linux-x64
            dist/kbc-app-linux-arm64
            dist/kbc-app-darwin-x64
            dist/kbc-app-darwin-arm64
            dist/kbc-app-windows-x64.exe
