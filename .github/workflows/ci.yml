name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli

      - uses: actions/checkout@v4
        with:
          repository: keboola/ui
          path: ui
          sparse-checkout: packages/api-client
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        working-directory: cli
        run: bun install

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Check drift (registry vs api-client source)
        working-directory: cli
        run: bun run generator/generate.ts --verify-only

      - name: Check workflow contracts
        working-directory: cli
        run: bun run generator/check-workflows.ts

      - name: Test CLI loads
        working-directory: cli
        run: bun run src/cli.ts --help

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: bun install

      - name: Build binary
        run: bun build src/cli.ts --compile --outfile dist/kbc-app

      - name: Test binary
        run: ./dist/kbc-app --help
