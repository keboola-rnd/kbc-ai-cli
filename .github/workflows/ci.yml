name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test CLI loads
        run: bun run src/cli.ts --help

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: bun install

      - name: Build binary
        run: bun build src/cli.ts --compile --outfile dist/kbc-app

      - name: Test binary
        run: ./dist/kbc-app --help
