name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Check workflow contracts
        run: bun run generator/check-workflows.ts

      - name: Verify generated code is up-to-date
        run: |
          bun run generator/generate.ts
          if [ -n "$(git diff --name-only src/generated/)" ]; then
            echo "ERROR: Generated files are out of date. Run 'make generate' and commit."
            git diff src/generated/
            exit 1
          fi
          echo "Generated files are up-to-date."

      - name: Test CLI loads
        run: bun run src/cli.ts --help

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: bun install

      - name: Build binary
        run: bun build src/cli.ts --compile --outfile dist/kbc-app

      - name: Test binary
        run: ./dist/kbc-app --help
